<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盤面ギャラリー | 一手帳</title>
<meta name="description" content="詰将棋の図や印象に残った一局の場面のスケッチギャラリー。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood:#DEC07E;
    --wood-dark:#C9A860;
    --frame:#3E2A1B;
    --ink:#241a10;
    --koma:#F6ECD9;
    --koma-shadow:#c9a55f;
    --shu:#a13d2b;
    --paper:#f4efe3;
    --paper-deep:#ece4d2;
    --line: rgba(62,42,27,0.55);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.mincho{font-family:'Shippori Mincho', serif;}
  a{color:inherit;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  /* ---------- header / nav (koma pieces) ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--paper);
    border-bottom:1px solid rgba(62,42,27,0.15);
  }
  .header-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px;
    max-width:1080px; margin:0 auto;
    gap:16px;
  }
  .brand{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:1.5rem;
    letter-spacing:0.12em;
    text-decoration:none;
    color:var(--ink);
    display:flex; align-items:baseline; gap:10px;
  }
  .brand small{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:400;
    font-size:0.62rem;
    letter-spacing:0.05em;
    color:#6b5b3f;
  }

  nav.koma-nav{display:flex; gap:14px;}
  .koma{
    --koma-w:58px; --koma-h:64px;
    position:relative;
    width:var(--koma-w); height:var(--koma-h);
    background:linear-gradient(160deg,var(--koma) 0%, var(--koma-shadow) 130%);
    clip-path:polygon(50% 0%, 100% 22%, 100% 100%, 0% 100%, 0% 22%);
    display:flex; align-items:center; justify-content:center;
    text-decoration:none;
    box-shadow:0 2px 3px rgba(0,0,0,0.25);
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  .koma span{
    writing-mode:vertical-rl;
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:0.82rem;
    color:var(--frame);
    letter-spacing:0.08em;
  }
  .koma.active{background:linear-gradient(160deg,#fff5df 0%, #dcb35f 130%);}
  .koma:hover{transform:translateY(-4px) rotate(-1deg); box-shadow:0 8px 10px rgba(0,0,0,0.28);}

  @media (max-width:640px){
    .header-inner{flex-direction:column; align-items:flex-start; gap:10px;}
    nav.koma-nav{width:100%; justify-content:space-between;}
    .koma{--koma-w:44px; --koma-h:50px;}
    .koma span{font-size:0.68rem;}
  }

  /* ---------- page header ---------- */
  .page-head{
    padding:64px 24px 40px;
    text-align:center;
  }
  .page-head .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.28em;
    color:var(--shu);
    font-weight:700;
    margin-bottom:14px;
  }
  .page-head h1{
    font-size:clamp(2rem, 5vw, 2.8rem);
    font-weight:800;
    letter-spacing:0.08em;
    margin:0 0 14px;
  }
  .page-head p{
    color:#5a4c34;
    font-size:0.95rem;
    max-width:460px;
    margin:0 auto;
  }

  /* ---------- gallery grid ---------- */
  .gallery{
    max-width:1080px;
    margin:0 auto;
    padding:0 24px 110px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:22px;
  }
  @media (max-width:820px){
    .gallery{grid-template-columns:repeat(2, 1fr);}
  }
  @media (max-width:520px){
    .gallery{grid-template-columns:1fr; max-width:400px;}
  }

  .tile{
    position:relative;
    background:var(--paper-deep);
    border:1px solid rgba(62,42,27,0.14);
    cursor:pointer;
    overflow:hidden;
    display:block;
    text-align:left;
    padding:0;
  }
  .tile-image{
    aspect-ratio:1/1;
    background:linear-gradient(150deg, var(--wood) 0%, var(--wood-dark) 100%);
    position:relative;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .tile-image::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(to right, var(--line) 0, var(--line) 1px, transparent 1px, transparent calc(100% / 5)),
      repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent calc(100% / 5));
    opacity:0.7;
  }
  .tile-image span{
    position:relative;
    z-index:1;
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:2.4rem;
    color:var(--frame);
    background:linear-gradient(160deg,var(--koma) 0%, var(--koma-shadow) 130%);
    clip-path:polygon(50% 0%, 100% 22%, 100% 100%, 0% 100%, 0% 22%);
    width:44%;
    aspect-ratio:0.92;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 8px rgba(0,0,0,0.28);
  }
  .tile-caption{
    padding:14px 16px 16px;
  }
  .tile-caption .tag{
    font-size:0.68rem;
    letter-spacing:0.1em;
    color:var(--shu);
    font-weight:700;
    margin-bottom:6px;
  }
  .tile-caption .title{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:0.98rem;
  }
  .tile:hover{transform:translateY(-4px); box-shadow:0 14px 24px rgba(36,26,16,0.18);}
  .tile{transition:transform 0.2s ease, box-shadow 0.2s ease;}

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(20,14,8,0.86);
    display:none;
    align-items:center; justify-content:center;
    padding:32px;
  }
  .lightbox.open{display:flex;}
  .lightbox-inner{
    max-width:520px; width:100%;
    background:var(--paper);
    border:1px solid rgba(255,255,255,0.1);
  }
  .lightbox-image{
    aspect-ratio:1/1;
    background:linear-gradient(150deg, var(--wood) 0%, var(--wood-dark) 100%);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .lightbox-image::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(to right, var(--line) 0, var(--line) 1px, transparent 1px, transparent calc(100% / 5)),
      repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent calc(100% / 5));
    opacity:0.7;
  }
  .lightbox-image span{
    position:relative; z-index:1;
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:3.6rem;
    color:var(--frame);
    background:linear-gradient(160deg,var(--koma) 0%, var(--koma-shadow) 130%);
    clip-path:polygon(50% 0%, 100% 22%, 100% 100%, 0% 100%, 0% 22%);
    width:44%;
    aspect-ratio:0.92;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 8px rgba(0,0,0,0.28);
  }
  .lightbox-text{padding:20px 22px 24px;}
  .lightbox-text .tag{font-size:0.7rem; letter-spacing:0.1em; color:var(--shu); font-weight:700; margin-bottom:8px;}
  .lightbox-text .title{font-family:'Shippori Mincho', serif; font-weight:700; font-size:1.1rem; margin-bottom:8px;}
  .lightbox-text p{margin:0; font-size:0.9rem; color:#4a3c24;}
  .lightbox-close{
    position:absolute; top:22px; right:26px;
    background:none; border:none;
    color:#f6ecd9; font-size:1.6rem; cursor:pointer;
    line-height:1;
  }

  /* ---------- footer ---------- */
  footer{
    background:var(--frame);
    color:#e9dfc6;
    padding:64px 24px 40px;
  }
  .footer-grid{
    max-width:1080px; margin:0 auto;
    display:grid; grid-template-columns:1.1fr 0.9fr; gap:56px;
  }
  @media (max-width:760px){
    .footer-grid{grid-template-columns:1fr; gap:40px;}
  }
  footer h4{
    font-family:'Shippori Mincho', serif;
    font-size:1rem; letter-spacing:0.1em;
    margin:0 0 18px; color:#f6ecd9;
  }
  .contact-form{display:flex; flex-direction:column; gap:12px;}
  .contact-form input, .contact-form textarea{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(233,223,198,0.28);
    color:#f6ecd9;
    padding:11px 13px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.9rem;
    border-radius:2px;
  }
  .contact-form textarea{resize:vertical; min-height:100px;}
  .contact-form button{
    align-self:flex-start;
    background:var(--shu);
    color:#fff;
    border:none;
    padding:11px 26px;
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    letter-spacing:0.06em;
    cursor:pointer;
    border-radius:2px;
    transition:background 0.2s ease;
  }
  .contact-form button:hover{background:#c14c37;}

  .links-list{list-style:none; padding:0; margin:0 0 30px; display:flex; flex-direction:column; gap:9px; font-size:0.9rem;}
  .links-list a{text-decoration:none; color:#e9dfc6; border-bottom:1px solid rgba(233,223,198,0.25); padding-bottom:2px;}
  .links-list a:hover{color:#fff; border-color:#fff;}

  .ai-notice{
    font-size:0.76rem;
    line-height:1.8;
    color:#c9bc9a;
    border-top:1px solid rgba(233,223,198,0.18);
    padding-top:24px;
    margin-top:30px;
  }
  .copyright{
    text-align:center;
    font-size:0.74rem;
    color:#a4977a;
    margin-top:30px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="brand">一手帳 <small>ITTE-CHŌ / 将棋勉強ノート</small></a>
    <nav class="koma-nav">
      <a href="index.html" class="koma"><span>盤面</span></a>
      <a href="blog.html" class="koma"><span>日記</span></a>
      <a href="gallery.html" class="koma active"><span>棋譜</span></a>
      <a href="about.html" class="koma"><span>自己紹介</span></a>
    </nav>
  </div>
</header>

<section class="page-head">
  <div class="eyebrow">GALLERY</div>
  <h1>盤面ギャラリー</h1>
  <p>詰将棋の図や、印象に残った一局の場面をスケッチにして残しています。クリックで拡大表示。</p>
</section>

<div class="gallery">

  <button class="tile" data-piece="王" data-tag="詰将棋" data-title="三手詰 no.01" data-text="王手・合駒・詰め上がりの三手。最短の形を意識して並べた図。">
    <div class="tile-image"><span>王</span></div>
    <div class="tile-caption">
      <div class="tag">詰将棋</div>
      <div class="title">三手詰 no.01</div>
    </div>
  </button>

  <button class="tile" data-piece="飛" data-tag="実戦譜" data-title="矢倉 中盤の局面" data-text="矢倉戦、飛車を振り直すか迷った局面のスケッチ。">
    <div class="tile-image"><span>飛</span></div>
    <div class="tile-caption">
      <div class="tag">実戦譜</div>
      <div class="title">矢倉 中盤の局面</div>
    </div>
  </button>

  <button class="tile" data-piece="角" data-tag="定跡研究" data-title="角換わり 序盤形" data-text="角換わり腰掛け銀、駒組みの基本形を確認するために描いた図。">
    <div class="tile-image"><span>角</span></div>
    <div class="tile-caption">
      <div class="tag">定跡研究</div>
      <div class="title">角換わり 序盤形</div>
    </div>
  </button>

  <button class="tile" data-piece="金" data-tag="詰将棋" data-title="五手詰 no.03" data-text="金と銀の連携で寄せる形。手順前後に注意したい一局。">
    <div class="tile-image"><span>金</span></div>
    <div class="tile-caption">
      <div class="tag">詰将棋</div>
      <div class="title">五手詰 no.03</div>
    </div>
  </button>

  <button class="tile" data-piece="銀" data-tag="実戦譜" data-title="終盤の寄せ合い" data-text="お互いの玉が薄くなった終盤、寄せ合いになった局面。">
    <div class="tile-image"><span>銀</span></div>
    <div class="tile-caption">
      <div class="tag">実戦譜</div>
      <div class="title">終盤の寄せ合い</div>
    </div>
  </button>

  <button class="tile" data-piece="桂" data-tag="定跡研究" data-title="桂馬の使い方メモ" data-text="桂馬の効果的な打ち方を並べ直したメモ用の図。">
    <div class="tile-image"><span>桂</span></div>
    <div class="tile-caption">
      <div class="tag">定跡研究</div>
      <div class="title">桂馬の使い方メモ</div>
    </div>
  </button>

</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <div class="lightbox-image"><span id="lb-piece">王</span></div>
    <div class="lightbox-text">
      <div class="tag" id="lb-tag"></div>
      <div class="title" id="lb-title"></div>
      <p id="lb-text"></p>
    </div>
  </div>
  <button class="lightbox-close" id="lb-close" aria-label="閉じる">×</button>
</div>

<footer>
  <div class="footer-grid">
    <div>
      <h4>お問い合わせ</h4>
      <form class="contact-form" action="https://formspree.io/f/maqvpvoz" method="POST">
        <input type="text" name="name" placeholder="お名前" required>
        <input type="email" name="email" placeholder="メールアドレス" required>
        <textarea name="message" placeholder="メッセージ" required></textarea>
        <button type="submit">送信する</button>
      </form>
    </div>
    <div>
      <h4>LINKS</h4>
      <ul class="links-list">
        <li><a href="https://azaleacreativeroom888.github.io/" target="_blank" rel="noopener">Azalea Creative Room</a></li>
        <li><a href="#" target="_blank" rel="noopener">Kakuyomu</a></li>
        <li><a href="#" target="_blank" rel="noopener">Pixiv</a></li>
        <li><a href="#" target="_blank" rel="noopener">YouTube — リリポピ</a></li>
        <li><a href="#" target="_blank" rel="noopener">Bluesky</a></li>
      </ul>
      <div class="ai-notice">
        本サイトに掲載されている文章・イラスト・図表等は、すべて作者に著作権があります。生成AIの学習データとして使用・収集することを禁止します。
      </div>
    </div>
  </div>
  <div class="copyright">© 一手帳 / Azalea Creative Room</div>
</footer>

<script>
  const lightbox = document.getElementById('lightbox');
  const lbPiece = document.getElementById('lb-piece');
  const lbTag = document.getElementById('lb-tag');
  const lbTitle = document.getElementById('lb-title');
  const lbText = document.getElementById('lb-text');

  document.querySelectorAll('.tile').forEach(tile => {
    tile.addEventListener('click', () => {
      lbPiece.textContent = tile.dataset.piece;
      lbTag.textContent = tile.dataset.tag;
      lbTitle.textContent = tile.dataset.title;
      lbText.textContent = tile.dataset.text;
      lightbox.classList.add('open');
    });
  });

  document.getElementById('lb-close').addEventListener('click', () => {
    lightbox.classList.remove('open');
  });
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) lightbox.classList.remove('open');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') lightbox.classList.remove('open');
  });
</script>

</body>
</html>
